<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultraviolet Proxy</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
        #iframe { width: 100%; height: 100%; border: none; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; color: #fff; z-index: 9999; font-family: sans-serif; transition: opacity 0.5s ease; }
        .spinner { border: 4px solid #333; border-top: 4px solid #fff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
    </div>

    <iframe id="iframe" src=""></iframe>

    <script>
        // 1. Define Config (Matches your uv.config.js exactly)
        self.__uv$config = {
            prefix: '/static/tiw/',
            bare: 'https://bare.benrogo.net',
            encodeUrl: Ultraviolet.codec.xor.encode,
            decodeUrl: Ultraviolet.codec.xor.decode,
            handler: '/static/uv/uv.handler.js',
            bundle: '/static/uv/uv.bundle.js',
            config: '/static/uv/uv.config.js',
            sw: '/static/uv/uv.sw.js',
        };

        // 2. Load Scripts
        (async () => {
            try {
                await import('/static/uv/uv.bundle.js');
                await import('/static/uv/uv.client.js'); // Only if you have this file
                await import('/static/uv/uv.handler.js');
                
                // Hide loader
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 500);
            } catch (e) {
                console.error("Failed to load UV scripts:", e);
                document.body.innerHTML = "<h1 style='color:white; text-align:center; margin-top:20%'>Error loading proxy scripts. Check console.</h1>";
            }
        })();

        // 3. Load Default Site (OpenRouter)
        const targetUrl = 'https://openrouter.ai';
        const encodedUrl = self.__uv$config.encodeUrl(targetUrl);
        document.getElementById('iframe').src = self.__uv$config.prefix + encodedUrl;
    </script>
</body>
</html>
