<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultraviolet Proxy</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111; font-family: monospace; }
        #iframe { width: 100%; height: 100%; border: none; }
        #debug { 
            position: fixed; top: 10px; left: 10px; 
            color: #0f0; background: #000; padding: 10px; 
            z-index: 10000; max-height: 100px; overflow-y: auto; 
            font-size: 12px; border: 1px solid #333;
        }
        .error { color: #f00; }
    </style>
</head>
<body>

    <div id="debug">Initializing...</div>
    <iframe id="iframe" src=""></iframe>

    <script>
        // 1. Config
        self.__uv$config = {
            prefix: '/static/tiw/',
            // Use a more reliable bare server if benrogo.net is blocked
            bare: 'https://bare-server.pages.dev', 
            encodeUrl: Ultraviolet.codec.xor.encode,
            decodeUrl: Ultraviolet.codec.xor.decode,
            handler: '/static/uv/uv.handler.js',
            bundle: '/static/uv/uv.bundle.js',
            config: '/static/uv/uv.config.js',
            sw: '/static/uv/uv.sw.js',
        };

        const debugDiv = document.getElementById('debug');
        const log = (msg, isError = false) => {
            debugDiv.innerHTML += `<div class="${isError ? 'error' : ''}">${msg}</div>`;
            console.log(msg);
        };

        // 2. Load Scripts
        (async () => {
            try {
                log('Loading uv.bundle.js...');
                await import('/static/uv/uv.bundle.js');
                log('uv.bundle.js loaded.');

                log('Loading uv.client.js...');
                await import('/static/uv/uv.client.js');
                log('uv.client.js loaded.');

                log('Loading uv.handler.js...');
                await import('/static/uv/uv.handler.js');
                log('uv.handler.js loaded.');

                log('Proxy ready. Loading OpenRouter...');
                
                // 3. Load Site
                const targetUrl = 'https://openrouter.ai';
                const encodedUrl = self.__uv$config.encodeUrl(targetUrl);
                document.getElementById('iframe').src = self.__uv$config.prefix + encodedUrl;
                
            } catch (e) {
                log('ERROR: ' + e.message, true);
                document.body.innerHTML = `<div style="color:white; padding:20px;">Error: ${e.message}</div>`;
            }
        })();
    </script>
</body>
</html>
